# Direct games for this Puck build only (protocol 202).
# mode=menu  use the Host and Join buttons
# mode=host  start a listen server when the menu opens
# mode=join  connect to address when the menu opens
mode=menu
port=7777
maxPlayers=12
password=
name=Direct Puck
address=
voip=true
upnp=false
# tickRate is the server sync tick and the host frame cap. Client input tick is tickRate + 20.
tickRate=360
# browserAddress is the Linux host that serves the server list, with no port.
# The browser rows come from that host. This file does not list servers.
browserAddress=5.161.44.246
